name: contagion-gnn
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # ── Core scientific stack ──────────────────────────────────────────────
  - numpy
  - pandas
  - scipy
  - scikit-learn

  # ── PyTorch (CPU build to start — Ryan/Kailash don't need GPU) ────────
  - pytorch
  - cpuonly

  # ── Notebooks ─────────────────────────────────────────────────────────
  - jupyterlab
  - ipykernel

  # ── Visualization ─────────────────────────────────────────────────────
  - matplotlib
  - seaborn

  # ── Config parsing ────────────────────────────────────────────────────
  - pyyaml

  # ── pip-only packages ─────────────────────────────────────────────────
  - pip
  - pip:
    - torch-geometric